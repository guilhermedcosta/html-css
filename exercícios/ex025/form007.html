<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" autocomplete="on">
        <p>
            <label for="iest">Estado: </label>
            <select name="est" id="iest">
                <option value="" selected>---Selecione o estado---</option>
                <optgroup label="Nordeste">
                    <option value="PE">Pernambuco</option>
                    <option value="CE">Ceará</option>
                    <option value="BA">Bahia</option>
                </optgroup>
                <optgroup label="Sudeste">
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="icur">Curso: </label>
            <input type="text" name="curso" id="icurso" list="lstcur">
            <datalist id="lstcur">
                <option value="DS">Desenvolvimento de Sistemas</option>
                <option value="MED">Medicina</option>
                <option value="DR">Direito</option>
                <option value="PD">Pedagogia</option>
                <option value="ART">Artes Cênicas</option>
            </datalist>
            <!-- Dá para usar optgroup no datalist-->
        </p>
        <p>
            <label for="imsg">Mensagem: </label> <br>
            <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Sua mensagem..."></textarea> <!--POST é melhor aqui-->
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
